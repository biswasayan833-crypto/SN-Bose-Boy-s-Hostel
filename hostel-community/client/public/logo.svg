<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  
  <!-- Stylized Shield Body -->
  <path d="M50 14 L80 26 C80 54 66 74 50 86 C34 74 20 54 20 26 Z" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="3" />
  
  <!-- Subtle Quantum orbital ellipse (S.N. Bose physics motif) -->
  <ellipse cx="50" cy="46" rx="22" ry="9" stroke="url(#glowGrad)" stroke-width="1.5" transform="rotate(-25 50 46)" opacity="0.75" />
  <ellipse cx="50" cy="46" rx="22" ry="9" stroke="url(#glowGrad)" stroke-width="1.5" transform="rotate(25 50 46)" opacity="0.75" />

  <!-- Mask / Anon Identity Silhouette -->
  <circle cx="50" cy="42" r="7" fill="url(#shieldGrad)" />
  <path d="M42 57 C42 51 46 49 50 49 C54 49 58 51 58 57" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Node accents -->
  <circle cx="50" cy="22" r="2.5" fill="#38bdf8" />
</svg>
